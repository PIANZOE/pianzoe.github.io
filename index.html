<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App Pianzoe by papá</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎹</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF5; --panel:#FFFFFF; --ink:#1D2433; --soft:#5B6478; --line:#C9D0DE;
  --felt:#B3263E; --felt-ink:#FFFFFF; --ok:#1F7A4D; --white-key:#FFFFFF; --black-key:#1D2433;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141926; --panel:#1E2536; --ink:#EEF1F7; --soft:#9AA3B8; --line:#333C52;
    --felt:#E0526B; --felt-ink:#141926; --ok:#4CC38A; --white-key:#E9ECF3; --black-key:#0A0D14;
  }
}
:root[data-theme="dark"]{
  --bg:#141926; --panel:#1E2536; --ink:#EEF1F7; --soft:#9AA3B8; --line:#333C52;
  --felt:#E0526B; --felt-ink:#141926; --ok:#4CC38A; --white-key:#E9ECF3; --black-key:#0A0D14;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:34rem;margin:0 auto;padding:1.5rem 1.1rem 2.5rem}
header{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:1.1rem}
h1{margin:0}
.brand{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;color:var(--ink);line-height:1.1}
.brand span{display:block;font-size:.95rem;font-weight:600;color:var(--felt);letter-spacing:0}
.score{font-weight:800;font-size:1.25rem;white-space:nowrap}
.score small{font-weight:400;color:var(--soft);font-size:.9rem}

.stage{background:var(--panel);border:1px solid var(--line);border-radius:1.25rem;
  padding:1.6rem 1.25rem 1.25rem;text-align:center}
.note{font-size:clamp(3rem,16vw,5.5rem);font-weight:800;line-height:1;letter-spacing:-.03em;margin:0;min-height:1em}
.verdict{font-size:1.4rem;font-weight:800;min-height:2.1rem;margin:.5rem 0 0}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--felt)}
.hint{color:var(--soft);margin:.2rem 0 1rem;min-height:1.5em;font-size:.95rem}
.bar{height:.4rem;background:var(--line);border-radius:999px;overflow:hidden;margin:0 auto 1.1rem;max-width:24rem}
.bar i{display:block;height:100%;width:0;background:var(--felt)}
.meter{height:.3rem;background:var(--line);border-radius:999px;overflow:hidden;margin:-.6rem auto 1.1rem;max-width:24rem}
.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .08s linear}
.hear{font-size:.95rem;color:var(--soft);margin:-.4rem 0 1rem;min-height:1.5em}
.hear b{color:var(--ink)}

.piano{position:relative;height:7rem;display:flex;margin:0 auto;max-width:24rem}
.wk{flex:1;background:var(--white-key);border:1px solid var(--line);border-radius:0 0 .45rem .45rem;margin:0 1px}
.bk{position:absolute;top:0;width:9%;height:60%;background:var(--black-key);border-radius:0 0 .35rem .35rem;z-index:2}
.wk.on,.bk.on{background:var(--felt)} .wk.heard,.bk.heard{box-shadow:inset 0 -.6rem 0 var(--ok)}

.controls{margin-top:1.5rem;display:grid;gap:1.1rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap}
button{font:inherit;font-weight:600;border-radius:999px;cursor:pointer;padding:.85rem 1.4rem;
  border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
button.primary{background:var(--felt);border-color:var(--felt);color:var(--felt-ink);flex:1}
button:focus-visible,input:focus-visible{outline:3px solid var(--felt);outline-offset:2px}
fieldset{border:0;padding:0;margin:0}
legend{font-weight:600;margin-bottom:.4rem}
.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.chips label{display:flex;align-items:center;gap:.4rem;padding:.45rem .85rem;border:1px solid var(--line);
  border-radius:999px;background:var(--panel);cursor:pointer}
.slider label{display:flex;justify-content:space-between;font-weight:600}
.slider input{width:100%;accent-color:var(--felt)}
.slider p{margin:.1rem 0 0;color:var(--soft);font-size:.85rem}
.warn{color:var(--felt);font-size:.95rem;margin:0}
</style>
</head>
<body>
<main>
  <header>
    <h1 class="brand">App Pianzoe <span>by papá</span></h1>
    <div class="score" aria-live="polite"><span id="hits">0</span><small> / <span id="tries">0</span> aciertos</small></div>
  </header>

  <section class="stage">
    <p class="note" id="note">🎹</p>
    <p class="verdict" id="verdict" aria-live="polite"></p>
    <p class="hint" id="hint">Pulsa Empezar y permite el micrófono.</p>
    <div class="bar"><i id="bar"></i></div>
    <div class="meter" aria-hidden="true"><i id="meter"></i></div>
    <p class="hear" id="hear"></p>
    <div class="piano" id="piano" aria-hidden="true"></div>
  </section>

  <div class="controls">
    <p class="warn" id="micWarn" hidden></p>
    <div class="row">
      <button class="primary" id="toggle">Empezar</button>
      <button id="reset">Reiniciar marcador</button>
    </div>

    <div class="slider">
      <label for="answer"><span>Tiempo para tocar la nota</span><span id="answerVal">5 s</span></label>
      <input type="range" id="answer" min="2" max="15" step="1" value="5">
    </div>

    <div class="slider">
      <label for="sens"><span>Sensibilidad del micrófono</span><span id="sensVal">Media</span></label>
      <input type="range" id="sens" min="1" max="3" step="1" value="2">
      <p>Bájala si hay ruido en la sala; súbela si el piano suena lejos.</p>
    </div>

    <fieldset>
      <legend>Qué notas incluir</legend>
      <div class="chips">
        <label><input type="checkbox" id="optFlat" checked> Bemoles</label>
        <label><input type="checkbox" id="optSharp" checked> Sostenidos</label>
        <label><input type="checkbox" id="optNatural"> Naturales</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>En pantalla mientras el alumno toca</legend>
      <div class="chips">
        <label><input type="checkbox" id="optShow"> Ver el nombre de la nota</label>
        <label><input type="checkbox" id="optHear" checked> Ver lo que oye el micrófono</label>
      </div>
    </fieldset>
  </div>
</main>

const BASE=[{n:"Do",s:0},{n:"Re",s:2},{n:"Mi",s:4},{n:"Fa",s:5},{n:"Sol",s:7},{n:"La",s:9},{n:"Si",s:11}];
const PC_NAMES=["Do","Do♯","Re","Re♯","Mi","Fa","Fa♯","Sol","Sol♯","La","La♯","Si"];
const $=id=>document.getElementById(id);
const noteEl=$("note"),verdictEl=$("verdict"),hintEl=$("hint"),hearEl=$("hear"),barEl=$("bar");

/* Teclado */
const keyEls={};
[0,2,4,5,7,9,11].forEach(s=>{const k=document.createElement("div");k.className="wk";$("piano").appendChild(k);keyEls[s]=k;});
[{s:1,a:0},{s:3,a:1},{s:6,a:3},{s:8,a:4},{s:10,a:5}].forEach(b=>{
  const k=document.createElement("div");k.className="bk";k.style.left=`calc(${(b.a+1)*(100/7)}% - 4.5%)`;
  $("piano").appendChild(k);keyEls[b.s]=k;});
function keys(target,heard){
  Object.entries(keyEls).forEach(([s,k])=>{k.classList.toggle("on",+s===target);k.classList.toggle("heard",+s===heard);});
}

/* Notas */
function pool(){const o=[];BASE.forEach(b=>{
  if($("optNatural").checked)o.push({t:b.n,s:b.s,sym:b.n});
  if($("optFlat").checked)o.push({t:b.n+" bemol",s:(b.s+11)%12,sym:b.n+"♭"});
  if($("optSharp").checked)o.push({t:b.n+" sostenido",s:(b.s+1)%12,sym:b.n+"♯"});});return o;}
let current=null;
function pick(){const p=pool();if(!p.length)return null;let n;
  do{n=p[Math.floor(Math.random()*p.length)];}while(p.length>1&&current&&n.t===current.t);return n;}

/* Audio de voz */
const player=new Audio();
function play(key){return new Promise(res=>{
  player.pause();player.src=CLIPS[key];player.currentTime=0;
  player.onended=res;player.onerror=res;player.play().catch(()=>{hintEl.textContent="El navegador bloqueó el sonido: pulsa Parar y Empezar otra vez.";res();});});}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* Micrófono y detección de tono */
let ctx,analyser,buf,listening=false,counts={},lastPc=null;
async function initMic(){
  if(analyser)return true;
  if(!navigator.mediaDevices?.getUserMedia){micError("Este navegador no permite usar el micrófono aquí.");return false;}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true}});
    if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
    const src=ctx.createMediaStreamSource(stream);
    analyser=ctx.createAnalyser();analyser.fftSize=2048;src.connect(analyser);
    buf=new Float32Array(analyser.fftSize);
    requestAnimationFrame(loop);return true;
  }catch(e){micError("No se pudo usar el micrófono. Permite el acceso en el navegador; si no aparece la opción, descarga la página y ábrela en Chrome.");return false;}
}
function micError(msg){$("micWarn").textContent=msg;$("micWarn").hidden=false;}
const RMS=[0,0.004,0.0015,0.0006];
const W=1024,MAXLAG=1024;
const HP=new Float32Array(2048);
function detect(raw,sr){
  // quitar componente continua y graves de ruido (filtro paso alto ~60 Hz)
  let mean=0;for(let i=0;i<raw.length;i++)mean+=raw[i];mean/=raw.length;
  const hk=Math.exp(-2*Math.PI*70/sr);
  for(let pass=0;pass<2;pass++){let py=0,px=(pass?HP[0]:raw[0]-mean);
    for(let i=0;i<raw.length;i++){const xv=pass?HP[i]:raw[i]-mean;py=hk*(py+xv-px);px=xv;HP[i]=py;}}
  const b=HP;
  let rms=0;for(let i=0;i<W+MAXLAG;i++)rms+=b[i]*b[i];rms=Math.sqrt(rms/(W+MAXLAG));
  if(rms<RMS[+$("sens").value])return null;
  const minLag=Math.floor(sr/4200),maxLag=Math.min(MAXLAG,Math.floor(sr/62));
  const n=new Float32Array(maxLag+1);
  for(let t=minLag;t<=maxLag;t++){
    let ac=0,m=0;
    for(let j=0;j<W;j++){const a=b[j],c=b[j+t];ac+=a*c;m+=a*a+c*c;}
    n[t]=m?2*ac/m:0;
  }
  // picos positivos (McLeod): se elige el primero cercano al máximo, evita errores de octava/quinta
  const peaks=[];let t=minLag;
  while(t<maxLag&&n[t]>0)t++;
  while(t<maxLag){
    while(t<maxLag&&n[t]<=0)t++;
    let bi=-1,bv=0;
    while(t<maxLag&&n[t]>0){if(n[t]>bv){bv=n[t];bi=t;}t++;}
    if(bi>0)peaks.push(bi);
  }
  if(!peaks.length)return null;
  let mx=0;peaks.forEach(p=>{if(n[p]>mx)mx=n[p];});
  if(mx<0.5)return null;
  const p=peaks.find(p=>n[p]>=0.88*mx);
  const a=n[p-1],c=n[p+1],d=a-2*n[p]+c;
  const T=d?p+(a-c)/(2*d):p;
  return {f:sr/T,clarity:n[p]};
}
let frame=0;
function loop(){
  requestAnimationFrame(loop);
  if(!listening||(frame++%2)){ if(!listening)$("meter").style.width="0"; return; }
  analyser.getFloatTimeDomainData(buf);
  let lv=0;for(let i=0;i<buf.length;i+=4)lv+=buf[i]*buf[i];lv=Math.sqrt(lv/(buf.length/4));
  $("meter").style.width=Math.min(100,Math.sqrt(lv/0.05)*100)+"%";
  const r=detect(buf,ctx.sampleRate);
  if(!r||r.f<62||r.f>4200)return;
  const midi=Math.round(12*Math.log2(r.f/440)+69),pc=((midi%12)+12)%12;
  counts[pc]=(counts[pc]||0)+1;
  if($("optHear").checked){
    let best=null,bn=0;for(const k in counts)if(counts[k]>bn){bn=counts[k];best=+k;}
    if(bn>=3){hearEl.innerHTML="Oigo: <b>"+PC_NAMES[best]+"</b>";keys(null,best);}
  }
}
/* Ronda */
let running=false,runId=0,hits=0,tries=0;
function score(){$("hits").textContent=hits;$("tries").textContent=tries;}
async function round(id){
  const n=pick();
  if(!n){stop();hintEl.textContent="Activa al menos un tipo de nota.";return;}
  current=n;
  verdictEl.textContent="";verdictEl.className="verdict";hearEl.textContent="";keys(null,null);
  noteEl.textContent=$("optShow").checked?n.sym:"?";
  hintEl.textContent="Escucha…";barEl.style.width="0";
  await play(n.t);if(id!==runId)return;

  counts={};lastPc=null;listening=true;hintEl.textContent="¡Toca la nota!";
  const total=+$("answer").value*1000,t0=performance.now();
  while(performance.now()-t0<total){
    if(id!==runId){listening=false;return;}
    barEl.style.width=((performance.now()-t0)/total*100)+"%";await sleep(50);
  }
  listening=false;barEl.style.width="100%";

  let best=null,bestN=0;for(const k in counts)if(counts[k]>bestN){bestN=counts[k];best=+k;}
  if(bestN<3)best=null;
  tries++;noteEl.textContent=n.sym;keys(n.s,best);
  hearEl.innerHTML=best===null?"Oigo: —":"Ha tocado: <b>"+PC_NAMES[best]+"</b>";
  if(best===n.s){
    hits++;score();verdictEl.textContent="✓ Correcto";verdictEl.className="verdict ok";
    hintEl.textContent=n.t;await play("_correcto");
  }else{
    score();verdictEl.className="verdict bad";
    if(best===null){verdictEl.textContent="✗ No se oyó ninguna nota";await play("_nada");}
    else{verdictEl.textContent="✗ Tocó "+PC_NAMES[best];await play("_incorrecto");}
    if(id!==runId)return;hintEl.textContent=n.t;await play(n.t);
  }
  if(id!==runId)return;await sleep(1200);
  if(id===runId&&running)round(id);
}
/* Desbloquear audio dentro del mismo toque (Chrome/Safari exigen gesto del usuario) */
let unlocked=false;
function unlockAudio(){
  try{ if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)(); ctx.resume(); }catch(e){}
  if(!unlocked){ try{ player.src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="; const p=player.play(); if(p)p.then(()=>{unlocked=true;}).catch(()=>{}); }catch(e){} }
}
async function start(){
  $("micWarn").hidden=true;
  const ok=await initMic();if(!ok)return;
  if(ctx.state!=="running"){ try{await ctx.resume();}catch(e){} }
  if(ctx.state!=="running"){ hintEl.textContent="Pulsa Empezar otra vez para activar el sonido."; return; }
  running=true;runId++;$("toggle").textContent="Parar";round(runId);
}
function stop(){running=false;runId++;listening=false;player.pause();$("toggle").textContent="Empezar";hintEl.textContent="En pausa.";}
$("toggle").onclick=()=>{ if(running){stop();return;} unlockAudio(); start(); };
$("reset").onclick=()=>{hits=0;tries=0;score();};
$("answer").oninput=e=>$("answerVal").textContent=e.target.value+" s";
$("sens").oninput=e=>$("sensVal").textContent=["","Baja","Media","Alta"][e.target.value];
</script>
